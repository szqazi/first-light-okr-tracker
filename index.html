:root{
  --ink:#202B31;
  --ink-soft:#56666D;
  --ink-mute:#8B9A9C;
  --paper:#F1ECE0;
  --surface:#FBF8F0;
  --surface-2:#E9E3D3;
  --border:rgba(32,43,49,0.14);
  --border-strong:rgba(32,43,49,0.26);
  --accent:#B9812E;
  --accent-strong:#7A551D;
  --accent-tint:#EFE1C6;
  --good:#5B7B52;
  --good-tint:#E3EADC;
  --shadow:rgba(32,43,49,0.16);
  --track:#E3DCC9;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#EDE7D8;
    --ink-soft:#B9B39F;
    --ink-mute:#7C8A82;
    --paper:#161F23;
    --surface:#1D2A2E;
    --surface-2:#25333731;
    --surface-2:#25333A;
    --border:rgba(237,231,216,0.14);
    --border-strong:rgba(237,231,216,0.24);
    --accent:#E0A94F;
    --accent-strong:#F2C077;
    --accent-tint:#3A2E17;
    --good:#8FB07E;
    --good-tint:#22301F;
    --shadow:rgba(0,0,0,0.4);
    --track:#2C3A3F;
  }
}
:root[data-theme="dark"]{
  --ink:#EDE7D8; --ink-soft:#B9B39F; --ink-mute:#7C8A82;
  --paper:#161F23; --surface:#1D2A2E; --surface-2:#25333A;
  --border:rgba(237,231,216,0.14); --border-strong:rgba(237,231,216,0.24);
  --accent:#E0A94F; --accent-strong:#F2C077; --accent-tint:#3A2E17;
  --good:#8FB07E; --good-tint:#22301F; --shadow:rgba(0,0,0,0.4); --track:#2C3A3F;
}
:root[data-theme="light"]{
  --ink:#202B31; --ink-soft:#56666D; --ink-mute:#8B9A9C;
  --paper:#F1ECE0; --surface:#FBF8F0; --surface-2:#E9E3D3;
  --border:rgba(32,43,49,0.14); --border-strong:rgba(32,43,49,0.26);
  --accent:#B9812E; --accent-strong:#7A551D; --accent-tint:#EFE1C6;
  --good:#5B7B52; --good-tint:#E3EADC; --shadow:rgba(32,43,49,0.16); --track:#E3DCC9;
}

*{box-sizing:border-box;}
body,.page{font-family:'Work UI',system-ui,sans-serif;}
.page{
  color:var(--ink);
  max-width:920px;
  margin:0 auto;
  padding:2.5rem 1.5rem 4rem;
}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}

.eyebrow{
  font-size:12px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--accent-strong);
  font-weight:600;
  margin:0 0 0.75rem;
}
h1{
  font-family:'Lora Voice',Georgia,serif;
  font-weight:500;
  font-size:clamp(28px,4.5vw,38px);
  line-height:1.18;
  text-wrap:balance;
  margin:0 0 0.9rem;
  max-width:16ch;
}
.dek{
  font-size:16px;
  line-height:1.7;
  color:var(--ink-soft);
  max-width:56ch;
  margin:0 0 2.5rem;
}

.stage{
  display:flex;
  justify-content:center;
  padding:1.5rem 0 3rem;
}

.phone{
  width:340px;
  background:var(--surface);
  border-radius:34px;
  border:0.5px solid var(--border-strong);
  box-shadow:0 24px 48px -20px var(--shadow), 0 4px 16px -8px var(--shadow);
  padding:12px;
  position:relative;
}
.island{
  width:90px;height:22px;background:var(--ink);border-radius:12px;
  margin:0 auto 8px;
}
.statusbar{
  display:flex;justify-content:space-between;align-items:center;
  font-size:12px;font-weight:500;color:var(--ink-soft);
  padding:0 8px 6px;
  font-variant-numeric:tabular-nums;
}
.statusicons{display:flex;gap:5px;align-items:center;font-size:13px;color:var(--ink);}

.screen{
  background:var(--paper);
  border-radius:22px;
  height:560px;
  overflow-y:auto;
  overflow-x:hidden;
  padding:16px 14px 8px;
  scrollbar-width:none;
}
.screen::-webkit-scrollbar{display:none;}
.pane{display:none;}
.pane.active{display:block;}

.screen-head{
  display:flex;justify-content:space-between;align-items:flex-start;
  margin-bottom:14px;
}
.screen-title{
  font-family:'Lora Voice',Georgia,serif;
  font-size:22px;font-weight:500;margin:0;
}
.screen-sub{font-size:12.5px;color:var(--ink-soft);margin:2px 0 0;}
.weektag{
  font-size:11px;font-weight:600;color:var(--accent-strong);
  background:var(--accent-tint);padding:4px 9px;border-radius:20px;
  white-space:nowrap;
}

.dayring{
  display:flex;align-items:center;gap:12px;
  background:var(--surface);border:0.5px solid var(--border);
  border-radius:14px;padding:12px 14px;margin-bottom:16px;
}
.ring{
  width:46px;height:46px;border-radius:50%;flex-shrink:0;
  background:conic-gradient(var(--accent) 0 33%, var(--track) 33% 100%);
  display:flex;align-items:center;justify-content:center;
}
.ring::after{
  content:"";width:32px;height:32px;border-radius:50%;background:var(--surface);
}
.dayring-text .n{font-size:13.5px;font-weight:600;display:block;}
.dayring-text .s{font-size:12px;color:var(--ink-soft);}

.acc{
  border:0.5px solid var(--border);
  border-radius:14px;
  margin-bottom:10px;
  overflow:hidden;
  background:var(--surface);
}
.acc-head{
  display:flex;align-items:center;gap:10px;
  padding:12px 13px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.acc-head i.cat{font-size:17px;color:var(--accent-strong);}
.acc-name{font-size:14px;font-weight:500;flex:1;}
.acc-frac{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
.acc-chev{font-size:15px;color:var(--ink-mute);transition:transform .18s ease;}
.acc.open .acc-chev{transform:rotate(180deg);}
.acc-body{
  display:none;
  padding:2px 13px 13px;
  border-top:0.5px solid var(--border);
}
.acc.open .acc-body{display:block;}

.item{
  display:flex;align-items:center;gap:9px;
  padding:7px 0;font-size:13.5px;
}
.chk{
  width:19px;height:19px;border-radius:6px;flex-shrink:0;
  border:1.5px solid var(--border-strong);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--surface);
}
.item.done .chk{background:var(--good);border-color:var(--good);}
.item.done span.label{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--border-strong);}

.grid5{
  display:grid;grid-template-columns:64px repeat(4,1fr);
  gap:5px;margin:6px 0 4px;
}

function iso(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function parseISO(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function mondayOf(d){ const day=(d.getDay()+6)%7; return addDays(d,-day); }
function fmtShort(d){ return d.toLocaleDateString("en-US",{month:"short",day:"numeric"}); }
function fmtWeekday(d){ return d.toLocaleDateString("en-US",{weekday:"long"}); }
function fmtRange(start,end){
  const sameMonth = start.getMonth()===end.getMonth();
  return sameMonth
    ? `${start.toLocaleDateString("en-US",{month:"short"})} ${start.getDate()}–${end.getDate()}`
    : `${fmtShort(start)} – ${fmtShort(end)}`;

  const out=[]; let d=new Date(start);

  return out;
}

const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const TODAY_ISO = iso(TODAY);

/* ---------- persistence ---------- */

const STORAGE_KEY = "firstlight.v1";

function loadStore(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return null;
}
function saveStore(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STORE)); }catch(e){}
}

let STORE = loadStore();
if(!STORE){
  STORE = { quarterStart: iso(mondayOf(TODAY)), why:{}, days:{} };
  saveStore();
}
if(!STORE.why) STORE.why = {};
if(!STORE.days) STORE.days = {};

const QUARTER_START = parseISO(STORE.quarterStart);
const QUARTER_END = addDays(QUARTER_START, QUARTER_WEEKS*7-1);

function dayRecord(dateISO){
  return STORE.days[dateISO] || {bool:{}, metrics:{}};
}
function setBool(dateISO,id,val){
  if(!STORE.days[dateISO]) STORE.days[dateISO] = {bool:{}, metrics:{}};
  if(val) STORE.days[dateISO].bool[id] = true;
  else delete STORE.days[dateISO].bool[id];
  saveStore();
}
function toggleBool(dateISO,id){
  const rec = dayRecord(dateISO);
  setBool(dateISO,id,!rec.bool[id]);
}
function setMetric(dateISO,id,val){
  if(!STORE.days[dateISO]) STORE.days[dateISO] = {bool:{}, metrics:{}};
  if(val===null || val===undefined || val==="") delete STORE.days[dateISO].metrics[id];
  else STORE.days[dateISO].metrics[id] = Number(val);
  saveStore();
}
function getWhy(objId){ return STORE.why[objId] || ""; }
function setWhy(objId,text){ STORE.why[objId] = text; saveStore(); }

/* ---------- KR / progress math ---------- */

function elapsedDates(rangeStart, rangeEnd){
  const end = rangeEnd < TODAY ? rangeEnd : TODAY;
  if(rangeStart > end) return [];
  return datesBetween(rangeStart, end);
}

function metricById(id){
  for(const cat of CATEGORIES){
    if(cat.metrics) for(const m of cat.metrics) if(m.id===id) return m;
  }
  return null;
}

function krActualPct(kr, dates){
  if(dates.length===0) return 0;
  const src = kr.source;
  if(src.type==="single"){
    let n=0; for(const d of dates) if(dayRecord(iso(d)).bool[src.id]) n++;
    return Math.round(n/dates.length*100);
  }
  if(src.type==="group"){
    let n=0, total=dates.length*src.ids.length;
    for(const d of dates){ const rec=dayRecord(iso(d)); for(const id of src.ids) if(rec.bool[id]) n++; }
    return total? Math.round(n/total*100) : 0;
  }
  if(src.type==="metric"){
    const m = metricById(src.id);
    let n=0; for(const d of dates){ const v=dayRecord(iso(d)).metrics[src.id]; if(v!==undefined && m.met(v)) n++; }
    return Math.round(n/dates.length*100);
  }
  return 0;
}

function objectiveAvgPct(obj, dates){
  if(!obj.krs.length) return 0;
  const sum = obj.krs.reduce((a,kr)=>a+krActualPct(kr,dates),0);
  return Math.round(sum/obj.krs.length);
}

/* ---------- week / quarter framing ---------- */

function weekInfoFor(date){
  const daysIn = Math.floor((date-QUARTER_START)/86400000);
  const weekNum = Math.min(QUARTER_WEEKS, Math.max(1, Math.floor(daysIn/7)+1));
  const weekStart = addDays(QUARTER_START, (weekNum-1)*7);
  const weekEnd = addDays(weekStart,6);
  return {weekNum, weekStart, weekEnd};
}

/* ---------- rendering: Today ---------- */

function catFraction(cat, dateISO){
  const rec = dayRecord(dateISO);
  if(cat.type==="prayer-grid"){
    let done=0, total=ROWS.length*COLS.length;
    for(const r of ROWS) for(const c of COLS) if(rec.bool[prayerId(r,c.key)]) done++;
    return {done,total};
  }
  if(cat.type==="checklist"){
    let done=0; for(const it of cat.items) if(rec.bool[it.id]) done++;
    return {done, total:cat.items.length};
  }
  if(cat.type==="health"){
    let done=0; for(const it of cat.items) if(rec.bool[it.id]) done++;
    for(const m of cat.metrics){ const v=rec.metrics[m.id]; if(v!==undefined && m.met(v)) done++; }
    return {done, total:cat.items.length+cat.metrics.length};
  }
  return {done:0,total:0};
}

function renderPrayerGrid(dateISO){
  const rec = dayRecord(dateISO);
  let html = `<div class="grid5"><div class="gh"></div>`;
  COLS.forEach(c=>html+=`<div class="gh">${c.label}</div>`);
  ROWS.forEach(row=>{
    html += `<div class="rl">${row}</div>`;
    COLS.forEach(c=>{
      const on = !!rec.bool[prayerId(row,c.key)];
      html += `<div class="cell${on?" on":""}" data-prayer-row="${row}" data-prayer-col="${c.key}">${on?'<svg class="icon"><use href="#ic-check"></use></svg>':'·'}</div>`;
    });
  });
  html += `</div>`;
  return html;
}

function renderChecklist(cat, dateISO){
  const rec = dayRecord(dateISO);
  return cat.items.map(it=>{
    const on = !!rec.bool[it.id];
    return `<div class="item${on?" done":""}" data-item="${it.id}">
      <span class="chk">${on?'<svg class="icon"><use href="#ic-check"></use></svg>':''}</span>
      <span class="label">${it.label}</span>
    </div>`;
  }).join("");
}

function renderMetrics(cat, dateISO){
  const rec = dayRecord(dateISO);
  return `<div class="metrics">` + cat.metrics.map(m=>{
    const v = rec.metrics[m.id];
    const met = v!==undefined && m.met(v);
    const shown = v!==undefined ? m.fmt(v) : "—";
    return `<div class="metric${met?" met":""}" data-metric="${m.id}">
      <div class="ml"><span>${m.label} ${met?'<svg class="icon"><use href="#ic-check"></use></svg>':''}</span></div>
      <div class="mv">${shown} <span class="goal">/ ${m.goal}</span></div>
    </div>`;
  }).join("") + `</div>`;
}

let openAcc = new Set(["prayers"]);

function renderToday(){
  document.getElementById("today-title").textContent = fmtWeekday(TODAY);
  document.getElementById("today-sub").textContent = fmtShort(TODAY);
  const {weekNum} = weekInfoFor(TODAY);
  document.getElementById("today-weektag").textContent = `Week ${weekNum} of ${QUARTER_WEEKS}`;

  let doneTotal=0, allTotal=0, openSections=0;
  const sectionsHtml = CATEGORIES.map(cat=>{
    const {done,total} = catFraction(cat, TODAY_ISO);
    doneTotal+=done; allTotal+=total;
    if(done<total) openSections++;
    const isOpen = openAcc.has(cat.key);
    let body;
    if(cat.type==="prayer-grid") body = renderPrayerGrid(TODAY_ISO);
    else if(cat.type==="checklist") body = renderChecklist(cat, TODAY_ISO);
    else body = renderChecklist(cat, TODAY_ISO) + renderMetrics(cat, TODAY_ISO);
    return `<div class="acc${isOpen?" open":""}" data-acc data-acc-key="${cat.key}">
      <div class="acc-head" data-acc-head>
        <svg class="icon cat"><use href="#${cat.icon}"></use></svg>
        <span class="acc-name">${cat.title}</span>
        <span class="acc-frac">${done}/${total}</span>
        <svg class="icon acc-chev"><use href="#ic-chevron"></use></svg>
      </div>
      <div class="acc-body">${body}</div>
    </div>`;
  }).join("");
  document.getElementById("today-sections").innerHTML = sectionsHtml;

  const pct = allTotal? Math.round(doneTotal/allTotal*100) : 0;
  document.getElementById("day-ring").style.background = `conic-gradient(var(--accent) 0 ${pct}%, var(--track) ${pct}% 100%)`;
  document.getElementById("day-ring-n").textContent = `${doneTotal} of ${allTotal} today`;
  document.getElementById("day-ring-s").textContent = openSections>0
    ? `${pct}% — ${openSections} section${openSections===1?"":"s"} still open`
    : `${pct}% — everything logged`;

  wireToday();
}

function wireToday(){
  document.querySelectorAll('#today-sections [data-acc-head]').forEach(h=>{
    h.addEventListener('click',()=>{
      const acc = h.closest('[data-acc]');
      const key = acc.dataset.accKey;
      acc.classList.toggle('open');
      if(acc.classList.contains('open')) openAcc.add(key); else openAcc.delete(key);
    });
  });
  document.querySelectorAll('#today-sections [data-item]').forEach(el=>{
    el.addEventListener('click',()=>{
      toggleBool(TODAY_ISO, el.dataset.item);
      renderToday();
    });
  });
  document.querySelectorAll('#today-sections [data-prayer-row]').forEach(el=>{
    el.addEventListener('click',()=>{
      toggleBool(TODAY_ISO, prayerId(el.dataset.prayerRow, el.dataset.prayerCol));
      renderToday();
    });
  });
  document.querySelectorAll('#today-sections [data-metric]').forEach(el=>{
    el.addEventListener('click',()=>openMetricModal(el.dataset.metric));
  });
}

/* ---------- rendering: Week ---------- */

function krRowHtml(kr, dates){
  const actual = krActualPct(kr, dates);
  return `<div class="kr-row">
    <div class="kr-label">${kr.label}</div>
    <div class="kr-bar"><div class="kr-fill" style="width:${Math.min(actual,100)}%"></div><div class="kr-target" style="left:${Math.min(kr.target,100)}%"></div></div>
    <div class="kr-nums"><span class="actual">${actual}% this week</span><span>target ${kr.target}%</span></div>
  </div>`;
}

function renderWeek(){
  const {weekNum, weekStart, weekEnd} = weekInfoFor(TODAY);
  document.getElementById("week-sub").textContent = fmtRange(weekStart, weekEnd);
  document.getElementById("week-weektag").textContent = `W${weekNum} of ${QUARTER_WEEKS}`;
  const dates = elapsedDates(weekStart, weekEnd);

  const el = document.getElementById('week-list');
  el.innerHTML = OBJECTIVES.map((o,i)=>`
    <div class="acc${i===0?' open':''}" data-acc>
      <div class="acc-head" data-acc-head>
        <svg class="icon cat"><use href="#${o.icon}"></use></svg>
        <span class="acc-name">${o.title}</span>
        <span class="acc-frac">${objectiveAvgPct(o,dates)}%</span>
        <svg class="icon acc-chev"><use href="#ic-chevron"></use></svg>
      </div>
      <div class="acc-body">${o.krs.map(kr=>krRowHtml(kr,dates)).join('')}</div>
    </div>`).join('');

  el.querySelectorAll('[data-acc-head]').forEach(h=>{
    h.addEventListener('click',()=>h.closest('[data-acc]').classList.toggle('open'));
  });
}

/* ---------- rendering: Quarter ---------- */

function renderQuarterList(){
  const dates = elapsedDates(QUARTER_START, QUARTER_END);
  document.getElementById("quarter-title").textContent = `${QUARTER_START.toLocaleDateString("en-US",{month:"short",year:"numeric"})} plan`;

  const overall = OBJECTIVES.length ? Math.round(OBJECTIVES.reduce((a,o)=>a+objectiveAvgPct(o,dates),0)/OBJECTIVES.length) : 0;
  document.getElementById("q-ring").style.background = `conic-gradient(var(--accent) 0 ${overall}%, var(--track) ${overall}% 100%)`;
  document.getElementById("q-ring").innerHTML = `<div class="qring-inner">${overall}%</div>`;

  const {weekNum} = weekInfoFor(TODAY);
  const pace = Math.round(weekNum/QUARTER_WEEKS*100);
  document.getElementById("q-summary").innerHTML = `Week ${weekNum} of ${QUARTER_WEEKS} — elapsed pace would put you at <b>~${pace}%</b> of the quarter`;

  const cardsEl = document.getElementById('obj-cards');
  cardsEl.innerHTML = OBJECTIVES.map((o,i)=>{
    const pct = objectiveAvgPct(o,dates);
    return `<div class="obj-card" data-obj="${i}">
      <div class="obj-ic"><svg class="icon"><use href="#${o.icon}"></use></svg></div>
      <div class="obj-body">
        <p class="obj-title">${o.title}</p>
        <div class="obj-bar"><div class="obj-fill" style="width:${Math.min(pct,100)}%"></div></div>
      </div>
      <div class="obj-pct">${pct}%</div>
    </div>`;
  }).join('');
  cardsEl.querySelectorAll('.obj-card').forEach(card=>{
    card.addEventListener('click',()=>openDetail(+card.dataset.obj));
  });
}

function openDetail(i){
  const o = OBJECTIVES[i];
  const dates = elapsedDates(QUARTER_START, QUARTER_END);
  document.getElementById('quarter-list').style.display='none';
  const d = document.getElementById('quarter-detail');
  d.style.display='block';
  const why = getWhy(o.id);
  d.innerHTML = `
    <div class="back" id="back-btn"><svg class="icon"><use href="#ic-arrow-left"></use></svg>Quarter</div>
    <p class="screen-title" style="margin-bottom:10px;">${o.title}</p>
    ${why
      ? `<div class="why-card"><p class="why-label">Why this matters</p><p class="why-text">${escapeHtml(why)}</p><span class="why-edit" data-why-edit="${o.id}"><svg class="icon"><use href="#ic-edit"></use></svg></span></div>`
      : `<button class="why-empty" data-why-edit="${o.id}"><svg class="icon"><use href="#ic-plus"></use></svg>Add why this matters to you</button>`}
    <div class="kr-card">${o.krs.map(kr=>krRowHtml(kr,dates)).join('')}</div>
  `;
  document.getElementById('back-btn').addEventListener('click',()=>{
    d.style.display='none';
    document.getElementById('quarter-list').style.display='block';
  });
  d.querySelectorAll('[data-why-edit]').forEach(el=>{
    el.addEventListener('click',()=>openWhyModal(el.dataset.whyEdit, o.title, ()=>openDetail(i)));
  });
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ---------- modals ---------- */

function closeModal(){
  document.getElementById('modal-root').innerHTML = '';
}

function openMetricModal(metricId){
  const m = metricById(metricId);
  const rec = dayRecord(TODAY_ISO);
  const current = rec.metrics[metricId];
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal">
        <div class="modal-head"><p class="modal-title">${m.label}</p><span class="modal-close" id="modal-close"><svg class="icon"><use href="#ic-x"></use></svg></span></div>
        <p class="field-label">Goal: ${m.goal}</p>
        <input type="number" inputmode="decimal" id="metric-input" placeholder="${m.placeholder}" value="${current!==undefined?current:''}">
        <div class="modal-actions">
          <button class="btn btn-ghost" id="metric-cancel">Cancel</button>
          <button class="btn btn-primary" id="metric-save">Save</button>
        </div>
      </div>
    </div>`;
  const input = document.getElementById('metric-input');
  input.focus();
  document.getElementById('modal-close').addEventListener('click',closeModal);
  document.getElementById('metric-cancel').addEventListener('click',closeModal);
  document.getElementById('modal-backdrop').addEventListener('click',e=>{ if(e.target.id==='modal-backdrop') closeModal(); });
  document.getElementById('metric-save').addEventListener('click',()=>{
    setMetric(TODAY_ISO, metricId, input.value===''?null:input.value);
    closeModal();
    renderToday();
  });
}

function openWhyModal(objId, objTitle, onSaved){
  const current = getWhy(objId);
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal">
        <div class="modal-head"><p class="modal-title">Why this matters</p><span class="modal-close" id="modal-close"><svg class="icon"><use href="#ic-x"></use></svg></span></div>
        <p class="field-label">${objTitle}</p>
        <textarea id="why-input" placeholder="Why does this objective matter to you?">${escapeHtml(current)}</textarea>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="why-cancel">Cancel</button>
          <button class="btn btn-primary" id="why-save">Save</button>
        </div>
      </div>
    </div>`;
  const input = document.getElementById('why-input');
  input.focus();
  document.getElementById('modal-close').addEventListener('click',closeModal);
  document.getElementById('why-cancel').addEventListener('click',closeModal);
  document.getElementById('modal-backdrop').addEventListener('click',e=>{ if(e.target.id==='modal-backdrop') closeModal(); });
  document.getElementById('why-save').addEventListener('click',()=>{
    setWhy(objId, input.value.trim());
    closeModal();
    onSaved();
  });
}

/* ---------- tabs ---------- */

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
    document.getElementById('pane-'+btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab==='week') renderWeek();
    if(btn.dataset.tab==='quarter') renderQuarterList();
  });
});

/* ---------- add goal (UI placeholder — no backend yet) ---------- */

document.getElementById('add-goal-btn').addEventListener('click',()=>{
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal">
        <div class="modal-head"><p class="modal-title">Add a new goal</p><span class="modal-close" id="modal-close"><svg class="icon"><use href="#ic-x"></use></svg></span></div>
        <p class="field-label">Creating new objectives isn't wired up yet — this is just the button for now.</p>
        <div class="modal-actions"><button class="btn btn-primary" id="add-goal-ok">Got it</button></div>
      </div>
    </div>`;
  document.getElementById('modal-close').addEventListener('click',closeModal);
  document.getElementById('add-goal-ok').addEventListener('click',closeModal);
  document.getElementById('modal-backdrop').addEventListener('click',e=>{ if(e.target.id==='modal-backdrop') closeModal(); });
});

/* ---------- iOS "add to home screen" hint ---------- */

(function iosHint(){
  const standalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
  const ua = navigator.userAgent;
  const isIOS = /iphone|ipad|ipod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints>1);
  let dismissed = false;
  try{ dismissed = localStorage.getItem('firstlight.ioshint.dismissed')==='1'; }catch(e){}
  if(!standalone && isIOS && !dismissed){
    const hint = document.getElementById('ios-hint');
    hint.style.display = 'flex';
    document.getElementById('ios-hint-close').addEventListener('click',()=>{
      hint.style.display = 'none';
      try{ localStorage.setItem('firstlight.ioshint.dismissed','1'); }catch(e){}
    });
  }
})();

/* ---------- service worker ---------- */

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('service-worker.js').catch(()=>{}); });
}

/* ---------- boot ---------- */

renderToday();

})();
</script>
